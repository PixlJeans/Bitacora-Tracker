[package]
name = "bitacora-tracker"
version = "1.6.15"
description = "Tracking of SETENA environmental logbooks (bitácoras)"
authors = ["Cognose"]
edition = "2021"

[lib]
name = "bitacora_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tiny_http = "0.12"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
