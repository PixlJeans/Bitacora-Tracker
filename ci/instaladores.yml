# Compila los instaladores de Bitácora Tracker:
#   Windows → .exe (NSIS) y .msi      macOS → .dmg universal (Intel + Apple Silicon)
# Se ejecuta a mano (Actions → Instaladores → Run workflow) o al subir una etiqueta v1.0.0, v1.1.0…
# Los instaladores quedan como "artefactos" de la ejecución y en un borrador de Release.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            nombre: windows
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            nombre: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias
        run: npm install

      - name: Generar íconos oficiales
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Compilar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bitácora Tracker v__VERSION__'
          releaseBody: 'Instaladores para Windows (.exe / .msi) y macOS (.dmg).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-tracker-${{ matrix.nombre }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn
