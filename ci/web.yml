# Web version: page + api.php (optional; the desktop app doesn't need it).
# Builds on every change to main and is left ready to upload to the hosting in the «web» branch
# (and as the bitacora-tracker-web.zip artifact).
name: Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Check api.php
        run: php -l web/api.php
      - name: Build
        run: |
          npm install
          npm run build:web
          cp web/.htaccess web/.user.ini dist-web/
          rm -f dist-web/config.php
          cd dist-web && zip -r ../bitacora-tracker-web.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-tracker-web
          path: bitacora-tracker-web.zip
      - name: Publish to the «web» branch
        run: |
          cd dist-web
          git init -q -b web
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Web version ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web
