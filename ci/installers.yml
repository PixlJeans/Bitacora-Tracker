# Builds the Bitácora Tracker installers and PUBLISHES the update:
#   Windows → .exe (NSIS) and .msi      macOS → universal .dmg (Intel + Apple Silicon)
# Runs when a v1.6.1, v1.6.2… tag is pushed (publish-update.bat does it) or by hand.
# Publishes a Release with a signed latest.json: installed apps find it and update themselves.
# Needs the TAURI_SIGNING_PRIVATE_KEY secret (set up by setup-updates.bat).
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            nombre: windows
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            nombre: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bitácora Tracker v__VERSION__'
          releaseBody: 'Installed apps update themselves. To install from scratch: Windows (.exe) or macOS (.dmg).'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-tracker-${{ matrix.nombre }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn
