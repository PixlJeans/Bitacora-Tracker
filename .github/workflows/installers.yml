# Builds the Bitácora Tracker installers in the cloud (draft Release):
#   Windows → .exe (NSIS) and .msi      macOS → universal .dmg (Intel + Apple Silicon)
# Optional: the app is normally built and installed on the laptop with update-app.bat, and GitHub only keeps a
# backup of the code. Run this by hand if you ever want installers built in the cloud (e.g. the Mac .dmg).
name: Installers

on:
  workflow_dispatch:   # only by hand (Actions → Installers → Run workflow); the app is built on the laptop

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
            name: windows
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            name: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bitácora Tracker v__VERSION__'
          releaseBody: 'Installers: Windows (_x64-setup.exe) or macOS (.dmg).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-tracker-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn
